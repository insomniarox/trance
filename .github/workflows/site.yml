name: Website

# Rebuilds the website, whose download links, version and counts of presets,
# visitors and palettes are read from Trance's newest release when it is
# built. The release workflow calls this once a release is out; it can also
# be started by hand (gh workflow run site.yml). Coolify's deploy API does
# it; force skips its build cache, without which nothing on the site's side
# has changed and the old page would be kept. Only the two secrets are used:
# the API's deploy URL, https://<coolify>/api/v1/deploy?uuid=<app>&force=true,
# and a token with the deploy permission. Without them it says so and stops.
on:
  workflow_call:
    secrets:
      SITE_DEPLOY_URL:
        required: false
      SITE_DEPLOY_TOKEN:
        required: false
  workflow_dispatch:

permissions: {}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Rebuild the website
        env:
          DEPLOY_URL: ${{ secrets.SITE_DEPLOY_URL }}
          DEPLOY_TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_URL" ] || [ -z "$DEPLOY_TOKEN" ]; then
            echo "::warning title=Website not rebuilt::Set SITE_DEPLOY_URL and SITE_DEPLOY_TOKEN to rebuild it after a release."
            exit 0
          fi
          # Coolify's deploy API takes a POST; a GET is answered 405.
          curl -fsS --retry 3 --max-time 30 -X POST -H "Authorization: Bearer $DEPLOY_TOKEN" "$DEPLOY_URL"
