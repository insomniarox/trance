name: Windows

on:
  push:
    branches: [master]
    # A tag such as v0.2.0 is a release: what is built is published as one.
    tags: ['v*']
  workflow_dispatch:

# Reading the code is all the run needs to do with the repository.
permissions:
  contents: read

jobs:
  build:
    # Windows Server 2025 is the same build of Windows as Windows 11 24H2.
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      # With no console window to write to, Qt sends what the tests and the
      # window have to say to a debugger instead, unless told otherwise.
      QT_FORCE_STDERR_LOGGING: 1
    steps:
      # GitHub's own actions are taken by version. The others are taken by the
      # commit a version stood at, so that what runs here can't be changed
      # under it.
      - uses: actions/checkout@v7

      # A release has to be the version the program and installer say.
      - name: The tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          . bin\msvc.ps1
          if ("v$(Get-TranceVersion)" -ne $env:GITHUB_REF_NAME) {
            throw "The tag is $env:GITHUB_REF_NAME, but trance.pro gives VERSION = $(Get-TranceVersion)."
          }

      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true

      # The runner has no graphics card, and Windows by itself has OpenGL 1.1.
      # Mesa draws in software, and is as strict about shaders as it is on
      # Linux. (The software renderer Qt brings along is a Mesa from 2016
      # that stops at OpenGL 3.0, short of the 3.3 Trance needs.)
      - uses: ssciwr/setup-mesa-dist-win@2dfeaebfa514f74c2b8cd8d27108c31486d33e72 # v3
        with:
          version: '26.0.3'
          build-type: 'release-msvc'
          deployment-choice: '1'

      - name: Build
        run: bin\build.ps1

      - name: Test
        run: bin\test.ps1

      # The runner has no sound card. A virtual cable gives it an output, and
      # an input that carries what the output plays, so that what Trance hears
      # can be tried: a tone that comes and goes is played, and every kind of
      # source has to hear it come and go. The cable is VB-Audio's and is
      # fetched from them; without it the rest goes on, and this is left out.
      - name: A sound card
        id: sound
        continue-on-error: true
        uses: LABSN/sound-ci-helpers@d08c889a7bba7d9b1b059f8f76dac4672ea3a9cf # v1

      # A run that went without is still green, so it says so where the run
      # is summed up: it has not shown that anything is heard.
      - name: No sound card
        if: steps.sound.outcome != 'success'
        run: echo "::warning title=Hearing not tried::The virtual cable could not be installed, so this run did not try what Trance hears."

      - name: Hearing
        if: steps.sound.outcome == 'success'
        run: |
          Start-Service Audiosrv
          # The runner's Windows keeps the microphone from applications.
          $consent = 'Software\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone'
          foreach ($key in "HKLM:\$consent", "HKCU:\$consent", "HKCU:\$consent\NonPackaged") {
            if (-not (Test-Path $key)) { New-Item $key -Force | Out-Null }
            Set-ItemProperty $key -Name Value -Value Allow
          }
          $tone = Start-Process powershell -PassThru -WindowStyle Hidden -ArgumentList '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', 'tests\tone.ps1'
          $env:TRANCE_TEST_HEARS = 'powershell'
          build\tests\trance_tests.exe captureHearsWhatPlays captureStartsAndStopsOnWindows
          $failed = $LASTEXITCODE
          build\trance.exe sources
          Stop-Process -Id $tone.Id
          exit $failed

      # The runner has no media players either. The test is two of them
      # itself, saying what they play to Windows' media controls as a browser
      # does, and Trance has to take the right titles from what Windows then
      # reports.
      - name: Titles
        run: |
          $env:TRANCE_TEST_TITLES = '1'
          build\tests\trance_tests.exe titlesFollowWhatWindowsSaysIsPlaying

      - name: Commands
        run: |
          function Must { if ($LASTEXITCODE) { throw "That exited with $LASTEXITCODE." } }
          build\trance.exe list | Select-Object -First 5; Must
          build\trance.exe sources; Must
          build\trance.exe check "Neon Tunnel" Whitecaps; Must
          build\trance.exe render "Neon Tunnel" -o render.png --seconds 2; Must

      - name: Package
        run: bin\package.ps1

      # As on a PC without Qt: the window has to come up from the package
      # alone, and answer the commands that steer it.
      - name: The package runs on its own
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch '\\Qt\\' }) -join ';'
          Remove-Item Env:QT_PLUGIN_PATH, Env:QML2_IMPORT_PATH, Env:QT_ROOT_DIR -ErrorAction SilentlyContinue
          $trance = "dist\trance\trance.exe"
          $window = Start-Process $trance -PassThru -RedirectStandardOutput window.out -RedirectStandardError window.err
          $until = (Get-Date).AddSeconds(90)
          do {
            Start-Sleep -Milliseconds 500
            $first = & $trance current 2>$null
          } until ($LASTEXITCODE -eq 0 -or $window.HasExited -or (Get-Date) -gt $until)
          if ($LASTEXITCODE -ne 0) {
            Get-Content window.out, window.err
            throw "The window did not come up."
          }
          & $trance preset Whitecaps
          if ((& $trance current) -ne "Whitecaps") { throw "The window did not change preset." }
          Start-Sleep -Seconds 3
          if ($window.HasExited) { Get-Content window.out, window.err; throw "The window went away." }
          Stop-Process -Id $window.Id
          Get-Content window.out, window.err

      # Inno Setup comes from its makers through Chocolatey, which the runner
      # has, unless the runner has it already.
      - name: Installer
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE) { throw "Inno Setup could not be installed." }
          }
          bin\installer.ps1

      # As a user would: installed without a question, found where Windows
      # looks, run, and then uninstalled without anything left behind.
      - name: The installer installs and uninstalls
        run: |
          $setup = Get-ChildItem dist\trance-*-setup.exe | Select-Object -First 1
          $p = Start-Process $setup.FullName -Wait -PassThru -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/LOG=install.log'
          if ($p.ExitCode) { Get-Content install.log; throw "Setup exited with $($p.ExitCode)." }
          $app = "$env:LOCALAPPDATA\Programs\Trance"
          $menu = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Trance.lnk"
          $paths = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\App Paths\trance.exe'
          if (-not (Test-Path "$app\trance.exe")) { throw "Trance is not in $app." }
          if (-not (Test-Path $menu)) { throw "There is no Start menu entry." }
          if ((Get-ItemProperty $paths).'(default)' -ne "$app\trance.exe") { throw "Windows is not told where trance.exe is." }
          & "$app\trance.exe" check "Neon Tunnel"
          if ($LASTEXITCODE) { throw "The installed Trance exited with $LASTEXITCODE." }
          # The uninstaller hands over to a copy of itself and returns at once.
          Start-Process "$app\unins000.exe" -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          $until = (Get-Date).AddSeconds(60)
          while ((Test-Path "$app\trance.exe") -and (Get-Date) -lt $until) { Start-Sleep -Milliseconds 500 }
          if (Test-Path "$app\trance.exe") { throw "Trance is still in $app after uninstalling." }
          if (Test-Path $menu) { throw "The Start menu entry is still there." }
          if (Test-Path $paths) { throw "Windows is still told where trance.exe was." }

      - uses: actions/upload-artifact@v7
        with:
          name: trance-release
          path: |
            dist/trance-*-windows-x64.zip
            dist/trance-*-setup.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trance-windows
          path: |
            dist/trance
            render.png
          if-no-files-found: ignore

  # Only for a tag, and only once everything above has passed: the zip and
  # the installer become a release on GitHub, with notes made from the commits
  # since the release before. This is the one job that may write to the
  # repository, and it runs nothing but GitHub's own tools.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: trance-release

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" trance-*-windows-x64.zip trance-*-setup.exe \
            --repo "$GITHUB_REPOSITORY" --title "Trance ${GITHUB_REF_NAME#v}" --generate-notes
